<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>J.A.R.V.I.S</title>
<style>
:root{--c:63,216,255}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(90% 90% at 40% 50%,#071c28 0%,#030a10 62%,#010407 100%);color:rgb(var(--c));font-family:"Bahnschrift","Orbitron","Segoe UI",system-ui,sans-serif;user-select:none}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(var(--c),.05) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--c),.05) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(70% 70% at 40% 50%,#000 15%,transparent 100%);-webkit-mask-image:radial-gradient(70% 70% at 40% 50%,#000 15%,transparent 100%);pointer-events:none}
body::after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);pointer-events:none;z-index:20}
#beam{position:fixed;left:0;right:0;height:120px;top:-120px;background:linear-gradient(180deg,transparent,rgba(var(--c),.07),transparent);animation:beam 7s linear infinite;pointer-events:none}
@keyframes beam{to{top:100%}}

/* ---------- estructura: escenario a la izquierda, panel de chat a la derecha ---------- */
#app{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) clamp(330px,36vw,440px);height:100vh}
#stage{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0}
#view{position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
.c{position:absolute;width:30px;height:30px;border:2px solid rgba(var(--c),.8);filter:drop-shadow(0 0 4px rgb(var(--c)));pointer-events:none}
.tl{top:12px;left:12px;border-right:0;border-bottom:0}.tr{top:12px;right:12px;border-left:0;border-bottom:0}
.bl{bottom:12px;left:12px;border-right:0;border-top:0}.br{bottom:12px;right:12px;border-left:0;border-top:0}
.t{font-size:11px;letter-spacing:.2em;text-shadow:0 0 8px rgba(var(--c),.9)}
#top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:22px 48px 0}
#n{font-size:20px;letter-spacing:.45em;font-weight:700}
#n small{display:block;font-size:10px;letter-spacing:.3em;opacity:.65;font-weight:400;margin-top:3px}
#n.g{animation:gl .35s steps(2) 1}
@keyframes gl{0%{transform:translate(-2px,1px);text-shadow:2px 0 #f0f,-2px 0 #0ff}50%{transform:translate(2px,-1px)}100%{transform:none}}
#r{text-align:right;font-size:16px;letter-spacing:.25em;white-space:nowrap}
#r small{display:block;font-size:10px;opacity:.6;letter-spacing:.3em;margin-top:3px}
#bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:end;padding:0 48px 24px}
.p{font-size:10px;letter-spacing:.18em;line-height:1.9;opacity:.8;border-left:2px solid rgba(var(--c),.6);padding-left:10px;text-shadow:0 0 6px rgba(var(--c),.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pr{text-align:right;border-left:0;border-right:2px solid rgba(var(--c),.6);padding-left:0;padding-right:10px}
.p b{font-weight:400;opacity:.55}
#s{text-align:center;font-size:13px;letter-spacing:.28em;line-height:1.5;text-shadow:0 0 12px rgba(var(--c),1)}
#foot{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;margin-top:6px}
#mw{display:flex;flex-direction:column;gap:6px;min-width:0}
#m{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mb{position:relative;width:160px;max-width:100%;height:6px;background:rgba(var(--c),.15);clip-path:polygon(0 0,100% 0,calc(100% - 4px) 100%,0 100%)}
#mf{height:100%;width:0;background:rgb(var(--c));box-shadow:0 0 10px rgb(var(--c))}
#mt{position:absolute;top:-3px;width:2px;height:12px;background:#ff5a5a}
#v{opacity:.75;text-align:center;white-space:nowrap}
#bt{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

button{background:rgba(var(--c),.06);border:1px solid rgba(var(--c),.6);color:rgb(var(--c));font:inherit;font-size:11px;letter-spacing:.25em;padding:5px 14px;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:.15s}
button:hover{background:rgba(var(--c),.25);box-shadow:0 0 14px rgba(var(--c),.6)}
#bt button{font-size:10px;letter-spacing:.18em;padding:5px 10px}

/* ---------- panel lateral ---------- */
#side{display:flex;flex-direction:column;min-height:0;min-width:0;background:rgba(2,10,16,.86);border-left:1px solid rgba(var(--c),.5);box-shadow:-10px 0 30px rgba(0,0,0,.4)}
#tabs{display:flex;border-bottom:1px solid rgba(var(--c),.35)}
.tab{flex:1;clip-path:none;border:0;border-bottom:2px solid transparent;background:transparent;padding:12px 6px;font-size:10px;letter-spacing:.25em;opacity:.6}
.tab:hover{background:rgba(var(--c),.1);box-shadow:none;opacity:1}
.tab.on{opacity:1;border-bottom-color:rgb(var(--c));background:rgba(var(--c),.08);text-shadow:0 0 8px rgba(var(--c),.8)}
.pane{display:flex;flex-direction:column;flex:1;min-height:0;padding:10px 12px 12px}
#chatHead{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.2em;opacity:.85;margin:0 2px 8px}
#chatState::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:rgb(var(--c));box-shadow:0 0 8px rgb(var(--c));margin-right:7px;vertical-align:1px}
#tools{display:flex;gap:6px;margin-bottom:8px}
#tools button{padding:5px 9px;font-size:9px;letter-spacing:.15em;white-space:nowrap}
.fld{flex:1;min-width:0;background:rgba(0,0,0,.38);border:1px solid rgba(var(--c),.35);color:#e8fbff;padding:6px 9px;outline:none;font:12px "Segoe UI",sans-serif;user-select:text}
.fld:focus{border-color:rgb(var(--c));box-shadow:0 0 10px rgba(var(--c),.2)}
#chips{display:flex;flex-wrap:wrap;gap:5px;max-height:70px;overflow-y:auto;margin-bottom:8px}
.chip{padding:4px 9px;font-size:9px;letter-spacing:.12em;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
#chatLog{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 4px 8px;user-select:text}
#chatLog:empty::before{content:"CONVERSACIÓN LISTA · ESCRIBE, USA / O EL MICRÓFONO";font-size:9px;letter-spacing:.12em;opacity:.45;padding:12px 4px}
.msg{flex:none;max-width:92%;padding:7px 10px 8px;border:1px solid rgba(var(--c),.22);background:rgba(var(--c),.06);color:#d9f7ff;font:12.5px/1.5 "Segoe UI",sans-serif;letter-spacing:.02em}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;border-color:rgba(255,190,80,.35);background:rgba(255,190,80,.08);color:#ffe6bd}
.msg.assistant{align-self:flex-start}
.msg.sys{align-self:center;max-width:100%;border-style:dashed;background:transparent;color:rgba(var(--c),.8);font-size:11.5px}
.meta{display:flex;align-items:center;gap:8px;font:9px "Bahnschrift","Segoe UI",sans-serif;letter-spacing:.18em;opacity:.65;margin-bottom:3px}
.meta .acts{margin-left:auto;display:flex;gap:4px;opacity:0;transition:.15s}
.msg:hover .acts{opacity:1}
.ma{padding:1px 6px;font-size:8px;letter-spacing:.12em;clip-path:none;border-color:rgba(var(--c),.4)}
.quick{display:flex;gap:6px;margin-top:7px}
.quick button{padding:4px 14px;font-size:10px}
.typing{display:flex;gap:4px;padding:10px 12px}
.typing span{width:6px;height:6px;border-radius:50%;background:rgb(var(--c));animation:tp 1s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.sep{align-self:center;flex:none;font-size:8px;letter-spacing:.25em;opacity:.4;padding:2px 0}
#sug{margin-bottom:6px;border:1px solid rgba(var(--c),.4);background:rgba(2,10,16,.95)}
.sg{padding:5px 10px;font:12px "Segoe UI",sans-serif;cursor:pointer;opacity:.85;border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg.on,.sg:hover{background:rgba(var(--c),.18);border-left-color:rgb(var(--c));opacity:1}
#composer{display:flex;gap:6px;align-items:flex-end}
#chatInput{flex:1;min-width:0;resize:none;height:38px;max-height:112px;background:rgba(0,0,0,.38);border:1px solid rgba(var(--c),.42);color:#e8fbff;padding:9px 11px;outline:none;font:13px/1.35 "Segoe UI",sans-serif;letter-spacing:.02em;user-select:text;overflow-y:auto}
#chatInput:focus{border-color:rgb(var(--c));box-shadow:0 0 12px rgba(var(--c),.2)}
#composer button{padding:10px 10px;font-size:10px;letter-spacing:.15em;height:38px}
#hint{font-size:8.5px;letter-spacing:.1em;opacity:.45;margin:7px 2px 0;line-height:1.5}
#chatLog::-webkit-scrollbar,#cm::-webkit-scrollbar,#chips::-webkit-scrollbar,#chatInput::-webkit-scrollbar{width:6px}
#chatLog::-webkit-scrollbar-thumb,#cm::-webkit-scrollbar-thumb,#chips::-webkit-scrollbar-thumb,#chatInput::-webkit-scrollbar-thumb{background:rgba(var(--c),.5)}

/* comandos */
#cm{flex:1;min-height:0;overflow-y:auto;font-size:11px;letter-spacing:.08em;margin-top:8px}
#cm .h{opacity:.7;margin-bottom:8px;line-height:1.6}
#cm details{border-top:1px solid rgba(var(--c),.25);padding:4px 0}
#cm summary{cursor:pointer;letter-spacing:.25em;padding:4px 0;list-style:none;text-shadow:0 0 8px rgba(var(--c),.8)}
#cm summary::-webkit-details-marker{display:none}
#cm summary::before{content:"▸ ";opacity:.7}#cm details[open] summary::before{content:"▾ "}
.i{display:block;padding:3px 8px;cursor:pointer;opacity:.85;border-left:2px solid transparent}
.i:hover{background:rgba(var(--c),.15);border-left-color:rgb(var(--c));opacity:1}
.i.n{cursor:default}.i.n:hover{background:none;border-left-color:transparent}

@media(max-width:900px){#app{grid-template-columns:minmax(0,1fr) 300px}#top,#bottom{padding-left:30px;padding-right:30px}#n{letter-spacing:.3em}}
</style></head>
<body>
<div id="beam"></div>
<div id="app">
  <section id="stage">
    <div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
    <header id="top">
      <div class="t" id="n">J.A.R.V.I.S<small>ASISTENTE · BRAY</small></div>
      <div class="t" id="r"><span id="rt">--:--:--</span><small id="rd">----</small></div>
    </header>
    <div id="view"><canvas id="cv"></canvas></div>
    <footer id="bottom">
      <div class="t p" id="pl"></div>
      <div class="t" id="s">INICIANDO</div>
      <div class="t p" id="pr"></div>
      <div id="foot">
        <div id="mw"><div class="t" id="m">MIC</div><div id="mb"><div id="mf"></div><div id="mt"></div></div></div>
        <div class="t" id="v">SISTEMA EN LINEA</div>
        <div id="bt"><button id="b">PROBAR MÚSICA</button><button id="x">SALIR</button></div>
      </div>
    </footer>
  </section>

  <aside id="side">
    <nav id="tabs"><button class="tab on" id="tabChat">CHAT</button><button class="tab" id="tabCmd">COMANDOS</button></nav>

    <div class="pane" id="paneChat">
      <div id="chatHead"><span>TERMINAL DE CONVERSACIÓN</span><span id="chatState">LISTO</span></div>
      <div id="tools">
        <input class="fld" id="q" type="text" autocomplete="off" placeholder="Buscar en la conversación…">
        <button id="btnExp" title="Guardar la conversación en un .txt">EXPORTAR</button>
        <button id="btnClr" title="Borrar el historial">LIMPIAR</button>
      </div>
      <div id="chips"></div>
      <div id="chatLog" aria-live="polite"></div>
      <div id="sug" hidden></div>
      <div id="composer">
        <textarea id="chatInput" rows="1" autocomplete="off" placeholder="Escribe una solicitud o / para comandos del chat…"></textarea>
        <button id="micBtn" title="Escuchar una orden por voz">MIC</button>
        <button id="sendBtn">ENVIAR</button>
      </div>
      <div id="hint">ENTER ENVÍA · SHIFT+ENTER NUEVA LÍNEA · ↑↓ HISTORIAL · TAB AUTOCOMPLETA · CTRL+K ENFOCA</div>
    </div>

    <div class="pane" id="paneCmd" hidden>
      <input class="fld" id="cq" type="text" autocomplete="off" placeholder="Filtrar comandos…">
      <div id="cm"></div>
    </div>
  </aside>
</div>

<script>
const $=id=>document.getElementById(id),st=$('s');
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

/* ================= HUD ================= */
let spec=new Array(48).fill(0),estado='escuchando',prevE='',level=0,target=0,pulse=0,t=0,tm=0,bassS=0,W=0,H=0,cx,cy,R,nv=0,um=0;
const T0=Date.now();
window.setSpec=(a,e,n,u)=>{spec=a;estado=e;nv=n||0;um=u||0};
window.setOye=x=>{$('v').textContent=x};
window.setMic=n=>{$('m').textContent='MIC · '+String(n).toUpperCase().slice(0,28)};
const TXT={escuchando:'ESCUCHANDO · DI «JARVIS»',hablando:'JARVIS ACTIVO',reproduciendo:'REPRODUCIENDO',orden:'ESCUCHANDO TU ORDEN…',sinmic:'SIN SEÑAL DEL MICROFONO · REVISA PRIVACIDAD > MICROFONO'};
const COL={escuchando:[63,216,255],hablando:[255,190,80],reproduciendo:[90,255,190],orden:[190,130,255],sinmic:[255,90,90]};
let col=[63,216,255],C='63,216,255';
const cv=$('cv'),g=cv.getContext('2d'),view=$('view');
function rs(){const d=devicePixelRatio||1;W=view.clientWidth;H=view.clientHeight;if(!W||!H)return;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);cx=W/2;cy=H/2-6;R=Math.min(W,H)*0.23}
addEventListener('resize',rs);if(window.ResizeObserver)new ResizeObserver(rs).observe(view);rs();
const P=Array.from({length:70},()=>({a:Math.random()*6.283,r:Math.random(),s:.0004+Math.random()*.0012,z:Math.random()}));
function ticks(r,n,len,long,rot,al){g.save();g.translate(cx,cy);g.rotate(rot);g.strokeStyle=`rgba(${C},${al})`;g.lineWidth=1;g.beginPath();for(let i=0;i<n;i++){const a=i/n*Math.PI*2,l=i%long===0?len*2:len;g.moveTo(Math.cos(a)*r,Math.sin(a)*r);g.lineTo(Math.cos(a)*(r+l),Math.sin(a)*(r+l))}g.stroke();g.restore()}
function segs(r,w,n,fill,rot,al){g.save();g.translate(cx,cy);g.rotate(rot);g.strokeStyle=`rgba(${C},${al})`;g.lineWidth=w;const s=Math.PI*2/n;for(let i=0;i<n;i++){g.beginPath();g.arc(0,0,r,i*s,i*s+s*fill);g.stroke()}g.restore()}
function ring(r,w,dash,rot,al){g.save();g.translate(cx,cy);g.rotate(rot);g.strokeStyle=`rgba(${C},${al})`;g.lineWidth=w;g.setLineDash(dash);g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.stroke();g.restore()}
function hexa(r,rot,al,w){g.save();g.translate(cx,cy);g.rotate(rot);g.strokeStyle=`rgba(${C},${al})`;g.lineWidth=w;g.beginPath();for(let i=0;i<=6;i++){const a=i/6*Math.PI*2;i?g.lineTo(Math.cos(a)*r,Math.sin(a)*r):g.moveTo(Math.cos(a)*r,Math.sin(a)*r)}g.stroke();g.restore()}
function radar(r,ang){g.save();g.translate(cx,cy);for(let i=0;i<28;i++){const a0=ang-i*0.035;g.fillStyle=`rgba(${C},${0.16*(1-i/28)})`;g.beginPath();g.moveTo(0,0);g.arc(0,0,r,a0-0.035,a0);g.closePath();g.fill()}
  g.strokeStyle=`rgba(${C},.8)`;g.lineWidth=1.5;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(ang)*r,Math.sin(ang)*r);g.stroke();g.restore()}
function nodos(r,n,rot,sz){g.save();g.translate(cx,cy);g.rotate(rot);g.fillStyle=`rgba(${C},.95)`;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;g.beginPath();g.arc(Math.cos(a)*r,Math.sin(a)*r,sz,0,6.283);g.fill()}g.restore()}
function espectro(){
  const N=96;g.save();g.translate(cx,cy);g.lineCap='round';g.lineWidth=3;
  for(let i=0;i<N;i++){
    const j=i<N/2?i:N-1-i,v=Math.pow(spec[Math.min(47,Math.floor(j*48/(N/2)*0.75))]||0,1.2);
    const a=i/N*Math.PI*2-Math.PI/2,r0=R*0.98,r1=r0+3+v*R*0.4;
    g.strokeStyle=`rgba(${C},${0.25+v*0.75})`;g.beginPath();g.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);g.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);g.stroke();
  }
  g.restore();
}
function barras(){
  if(H<260)return;
  const n=48,w=Math.min(W*0.5,360),x0=cx-w/2,y0=H-16;g.save();g.fillStyle=`rgba(${C},.75)`;
  for(let i=0;i<n;i++){const v=spec[i]||0,h=2+v*24;g.globalAlpha=.3+v*.7;g.fillRect(x0+i*(w/n),y0-h/2,w/n-2,h)}
  g.restore()
}
function draw(){
  if(!W||!H){requestAnimationFrame(draw);return}
  t+=0.016;
  const tg=COL[estado]||COL.escuchando;for(let i=0;i<3;i++)col[i]+=(tg[i]-col[i])*0.08;
  C=col.map(v=>v|0).join(',');document.documentElement.style.setProperty('--c',C);
  if(estado!==prevE){
    st.textContent=TXT[estado]||estado;
    if(estado==='hablando'){pulse=1;const n=$('n');n.classList.remove('g');void n.offsetWidth;n.classList.add('g')}
    if(estado==='orden')setChatState('ESCUCHANDO ORDEN');else if(prevE==='orden')setChatState('LISTO');
    prevE=estado}
  let a=0;for(let i=0;i<48;i++)a+=spec[i];a/=48;
  let b=0;for(let i=0;i<6;i++)b+=spec[i];b/=6;
  target=Math.max(target,Math.min(1,a*1.8));
  level+=(target-level)*0.25;target*=0.9;pulse*=0.94;
  bassS+=(Math.max(0,b-0.25)*1.4-bassS)*0.35;
  $('mf').style.width=Math.min(100,Math.sqrt(nv)*100)+'%';$('mt').style.left=Math.min(100,Math.sqrt(um)*100)+'%';
  const act=estado==='hablando'||estado==='reproduciendo';
  tm+=0.016*(1+(act?bassS*4:0));
  g.clearRect(0,0,W,H);
  const boost=level+pulse*0.8+(estado==='hablando'?0.15+0.1*Math.sin(t*9):0)+(act?bassS*1.1:0);
  g.shadowBlur=0;for(const p of P){p.a+=p.s*(1+boost*6);const r=R*(1.0+p.r*1.1),x=cx+Math.cos(p.a)*r,y=cy+Math.sin(p.a)*r;g.fillStyle=`rgba(${C},${(.15+.5*Math.abs(Math.sin(t*1.5+p.z*9)))*(.4+p.z*.6)})`;g.fillRect(x,y,1+p.z*1.6,1+p.z*1.6)}
  g.shadowColor=`rgba(${C},.9)`;g.shadowBlur=10;
  ticks(R*1.62,180,4,10,tm*0.05,.55);ring(R*1.52,1,[],0,.35);
  ring(R*1.57,1,[1,7],-tm*0.1,.45);
  segs(R*1.42,3,3,0.28,-tm*0.35,.85);segs(R*1.42,1,60,0.5,tm*0.1,.35);
  nodos(R*1.32,12,tm*0.3,2.2);
  ring(R*1.22,2,[2,10],tm*0.25,.7);segs(R*1.08,6,8,0.7,tm*0.45,.5+boost*.4);
  radar(R*0.92,tm*1.6);
  if(act)espectro();
  ring(R*0.92,1,[],0,.6);ticks(R*0.86,90,3,5,-tm*0.2,.7);segs(R*0.74,10,6,0.55,-tm*0.7,.35+boost*.5);
  hexa(R*0.66,tm*0.15,.5,1.5);hexa(R*0.58,-tm*0.22,.35,1);
  const gr=g.createRadialGradient(cx,cy,0,cx,cy,R*0.6);
  gr.addColorStop(0,`rgba(255,255,255,${.25+boost*.6})`);gr.addColorStop(.35,`rgba(${C},${.2+boost*.6})`);gr.addColorStop(1,`rgba(${C},0)`);
  g.shadowBlur=0;g.fillStyle=gr;g.beginPath();g.arc(cx,cy,R*0.6,0,Math.PI*2);g.fill();
  g.shadowBlur=14;g.strokeStyle=`rgba(${C},.95)`;g.lineWidth=2;g.beginPath();
  const n=140,amp=4+boost*R*0.22;
  for(let i=0;i<=n;i++){const an=i/n*Math.PI*2,w=Math.sin(an*7+t*8)*0.6+Math.sin(an*13-t*5)*0.4;const r=R*0.5+w*amp*(0.4+0.6*Math.abs(Math.sin(an*3+t*2)));const x=cx+Math.cos(an)*r,y=cy+Math.sin(an)*r;i?g.lineTo(x,y):g.moveTo(x,y)}
  g.closePath();g.stroke();
  g.shadowBlur=0;g.fillStyle=`rgba(${C},.9)`;g.beginPath();g.arc(cx,cy,3+boost*4,0,Math.PI*2);g.fill();
  barras();
  requestAnimationFrame(draw);
}

/* ---- cálculo seguro ---- */
function calc(e){
  const x=e.replace(/,/g,'.').replace(/\^/g,'**').replace(/×/g,'*').replace(/÷/g,'/');
  if(!/^[\d\s+\-*/().%]+$/.test(x))return null;
  try{const v=Function('"use strict";return ('+x+')')();return Number.isFinite(v)?String(+v.toPrecision(12)):null}catch(e){return null}
}

  }else{copiar(txt);addMsg('sys','Conversación copiada al portapapeles.')}
}

function slash(v){
  const parts=v.split(/\s+/),k=parts[0].toLowerCase(),arg=parts.slice(1).join(' ').trim();
  if(k==='/buscar'){$('q').value=arg;filtrar();flash(arg?'FILTRANDO':'FILTRO QUITADO');return}
  addMsg('user',v,{local:true});
  switch(k){
    case '/ayuda':local(SLASH.map(x=>x[0]+' — '+x[1]).join('\n')+'\n\nCualquier otra frase se interpreta como una orden normal, igual que por voz.');break;
    case '/limpiar':limpiar();break;
    case '/exportar':exportar();break;
    case '/comandos':tab('cmd');break;
    case '/alias':{const m=arg.match(/^(.+?)\s*(?:=|->|=>)\s*(.+)$/);if(!m){local('Uso: /alias el chisme = discord');break}enviar('aprende que '+m[1]+' es '+m[2]);break}
    case '/calc':{if(!arg){local('Uso: /calc 12*(3+4)');break}const r=calc(arg);local(r===null?'No pude calcular esa operación. Usa números y + − * / ( ) % ^':arg+' = '+r);break}
    case '/nota':{if(!arg){local('Uso: /nota comprar leche');break}notes.push({t:arg,ts:Date.now()});LS.set('jv_notes',notes);local('Nota #'+notes.length+' guardada.');break}
    case '/notas':local(notes.length?notes.map((n,i)=>(i+1)+'. '+n.t+'  ('+new Date(n.ts).toLocaleDateString('es-CR')+')').join('\n'):'No tienes notas guardadas.');break;
    case '/borrarnota':{const i=parseInt(arg,10);if(!(i>=1&&i<=notes.length)){local('Indica un número de nota válido: /borrarnota 2');break}notes.splice(i-1,1);LS.set('jv_notes',notes);local('Nota #'+i+' borrada.');break}
    case '/borrarnotas':notes=[];LS.set('jv_notes',notes);local('Todas las notas fueron borradas.');break;
    case '/repetir':{const u=msgs.slice(0,-1).reverse().find(m=>m.role==='user'&&m.text[0]!=='/');if(u)enviar(u.text);else local('No hay nada que repetir.');break}
    default:local('Comando desconocido: '+parts[0]+'. Escribe /ayuda.');
  }
}

/* ---- envío al asistente ---- */
function enviar(v){

  Promise.resolve(pywebview.api.orden(v)).then(r=>flash(r&&r.ok?'LISTO':'SIN INTERPRETAR')).catch(()=>{endPending();flash('ERROR')});
}

/* ---- sugerencias ---- */
const sug=$('sug');let sugItems=[],sel=-1;
function clearSug(){sugItems=[];sel=-1;sug.hidden=true;sug.innerHTML=''}
function paintSug(){
  const stick=log.scrollHeight-log.scrollTop-log.clientHeight<90;
  sug.innerHTML='';sug.hidden=!sugItems.length;
  sugItems.forEach((x,i)=>{const d=document.createElement('div');d.className='sg'+(i===sel?' on':'');d.textContent=x;d.onmousedown=e=>{e.preventDefault();pick(i)};sug.appendChild(d)});
  if(stick)log.scrollTop=log.scrollHeight;
}
function suggest(){
  const raw=inp.value,v=raw.trim();
  if(v.length<2||raw.includes('\n')){clearSug();return}
  const nv=norm(v);
  let pool;
  if(v[0]==='/'){if(/\s/.test(v)){clearSug();return}pool=SLASH.map(x=>x[0])}else pool=ALL;
  sugItems=pool.filter(x=>{const n=norm(x);return n!==nv&&n.includes(nv)})
    .sort((a,b)=>(norm(a).startsWith(nv)?0:1)-(norm(b).startsWith(nv)?0:1)).slice(0,5);
  sel=-1;paintSug();
}
function pick(i){
  const x=sugItems[i];if(x===undefined)return;
  const s=SLASH.find(y=>y[0]===x);
  clearSug();setVal(x+(s&&s[2]?' ':''));inp.focus();
}

function submit(){const v=inp.value.trim();if(!v)return;inp.value='';hi=-1;grow();clearSug();enviar(v)}

inp.addEventListener('input',()=>{hi=-1;grow();suggest()});
inp.addEventListener('keydown',e=>{
  const open=sugItems.length>0;
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(open&&sel>=0)pick(sel);else submit();return}
  if(e.key==='Tab'&&open){e.preventDefault();pick(sel>=0?sel:0);return}
  if(e.key==='Escape'){if(open)clearSug();else setVal('');return}
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    const up=e.key==='ArrowUp';
    if(open){e.preventDefault();sel=up?(sel<=0?sugItems.length-1:sel-1):(sel+1)%sugItems.length;paintSug();return}
    const h=histList();
    if(up&&(inp.value===''||hi>=0||(inp.selectionStart===0&&inp.selectionEnd===0))&&h.length){
      e.preventDefault();if(hi<0){draft=inp.value;hi=h.length-1}else if(hi>0)hi--;setVal(h[hi]);
    }else if(!up&&hi>=0){
      e.preventDefault();if(hi<h.length-1){hi++;setVal(h[hi])}else{hi=-1;setVal(draft)}
    }
  }
});
